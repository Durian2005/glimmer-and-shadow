    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", Arial, sans-serif;
        }
        /* 背景容器：全屏显示场景背景 */
        .bg-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            overflow: hidden;
        }
        .bg-container::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.3); /* 暗化背景突出前景 */
        }
        .bg-content {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 24px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
            background-size: cover;
            background-position: center;
        }
        /* 角色立绘容器：左右布局，默认隐藏 */
        .character-container {
            position: fixed;
            bottom: 200px;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            z-index: 1;
            display: flex;
            justify-content: space-between;
        }
        .character {
            width: 220px;
            height: 350px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            display: none;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 16px;
            text-align: center;
            padding: 10px;
        }
        .character.show {
            display: flex;
        }
        /* 文本框容器：固定底部 */
        .text-container {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 200px;
            background: rgba(0, 0, 0, 0.8);
            color: #fff;
            padding: 30px;
            z-index: 2;
            cursor: pointer;
            overflow: hidden;
        }
        .text-speaker {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #ffd700;
        }
        .text-content {
            font-size: 16px;
            line-height: 1.5;
            min-height: 60px;
        }
        .text-tip {
            position: absolute;
            bottom: 20px;
            right: 30px;
            font-size: 14px;
            color: #ccc;
        }
        /* 选择分支容器：默认隐藏 */
        .choice-container {
            position: fixed;
            bottom: 210px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 3;
            display: none;
        }
        .choice-btn {
            padding: 12px 24px;
            margin: 0 15px;
            background: rgba(70, 130, 180, 0.9);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .choice-btn:hover {
            background: rgba(100, 149, 237, 1);
            transform: translateY(-2px);
        }
        /* 回退按钮 */
        .back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            padding: 8px 16px;
            background: rgba(169, 169, 169, 0.8);
            color: #fff;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
            z-index: 4;
            transition: all 0.3s;
        }
        .back-btn:hover {
            background: rgba(128, 128, 128, 1);
        }
        .back-btn:disabled {
            background: rgba(169, 169, 169, 0.3);
            cursor: not-allowed;

        // 2. 栈结构：用于存储剧情进度，实现回退功能
        const storyStack = [];
        // 当前剧情索引
        let currentIndex = 0;
        // 元素获取
        const backBtn = document.getElementById("backBtn");
        const bgContent = document.getElementById("bgContent");
        const characterContainer = document.getElementById("characterContainer");
        const textSpeaker = document.getElementById("textSpeaker");
        const textContent = document.getElementById("textContent");
        const textContainer = document.getElementById("textContainer");
        const choiceContainer = document.getElementById("choiceContainer");

        // 3. 初始化剧情
        function initStory() {
            pushToStack(currentIndex); // 初始节点入栈
            showStoryNode(storyData[currentIndex]);
            updateBackBtnStatus();
        }

        // 4. 入栈操作：保存当前剧情索引（排除重复入栈，比如连续点击推进时）
        function pushToStack(index) {
            if (storyStack[storyStack.length - 1] !== index) {
                storyStack.push(index);
            }
        }

        // 5. 出栈操作：回退到上一个剧情节点
        function popFromStack() {
            if (storyStack.length > 1) { // 保留最后一个节点，不允许回退到初始化前
                storyStack.pop();
                currentIndex = storyStack[storyStack.length - 1];
                showStoryNode(storyData[currentIndex]);
                updateBackBtnStatus();
            }
        }

        // 6. 更新回退按钮状态
        function updateBackBtnStatus() {
            backBtn.disabled = storyStack.length <= 1;
        }

        // 7. 显示当前剧情节点（新增背景图设置逻辑）
        function showStoryNode(node) {
            // 更新背景图和描述
            if (node.bgImage) {
                bgContent.style.backgroundImage = `url(${node.bgImage})`;
                bgContent.innerHTML = `${node.scene}<br>${node.bgDesc}`; // 用<br>换行避免文本覆盖图片
            } else {
                bgContent.style.backgroundImage = "none";
                bgContent.textContent = `${node.scene}\n${node.bgDesc}`;
            }
            // 更新角色显示
            hideAllCharacters();
            if (node.showCharacters && node.showCharacters.length > 0) {
                node.showCharacters.forEach(charId => {
                    document.getElementById(charId).classList.add("show");
                });
            }
            // 更新文本
            textSpeaker.textContent = node.speaker;
            textContent.textContent = node.content;
            // 处理不同类型节点
            if (node.type === "choice") {
                // 显示选择分支
                renderChoices(node.choices);
                textContainer.style.pointerEvents = "none"; // 选择时禁止点击文本框推进
            } else {
                // 隐藏选择分支
                choiceContainer.innerHTML = "";
                textContainer.style.pointerEvents = "auto"; // 允许点击推进
                // 处理结束节点
                if (node.type === "end") {
                    textContainer.style.pointerEvents = "none";
                    textContainer.querySelector(".text-tip").textContent = "游戏结束";
                }
            }
        }

        // 8. 渲染选择分支按钮（修复了原代码的空渲染问题）
        function renderChoices(choices) {
            let choiceHtml = "";
            choices.forEach(choice => {
                choiceHtml += `<button class="choice-btn" onclick="chooseBranch(${choice.nextIndex})">${choice.text}</button>`;
            });
            choiceContainer.innerHTML = choiceHtml;
            choiceContainer.style.display = "block";
        }

        // 9. 选择分支：跳转对应剧情节点
        function chooseBranch(nextIndex) {
            pushToStack(nextIndex); // 选择后的节点入栈
            currentIndex = nextIndex;
            showStoryNode(storyData[currentIndex]);
            updateBackBtnStatus();
        }

        // 10. 推进剧情：点击文本框进入下一段
        function nextDialog() {
            // 非结束节点才允许推进
            if (storyData[currentIndex].type !== "end") {
                let nextIndex = currentIndex + 1;
                // 如果当前节点有指定跳转索引（如分支汇合），则使用指定索引
                if (storyData[currentIndex].hasOwnProperty("nextIndex")) {
                    nextIndex = storyData[currentIndex].nextIndex;
                }
                pushToStack(nextIndex); // 推进后的节点入栈
                currentIndex = nextIndex;
                showStoryNode(storyData[currentIndex]);
                updateBackBtnStatus();
            }
        }

        // 11. 隐藏所有角色
        function hideAllCharacters() {
            const allCharacters = document.querySelectorAll(".character");
            allCharacters.forEach(char => {
                char.classList.remove("show");
            });
        }

        // 12. 绑定回退按钮事件
        backBtn.addEventListener("click", popFromStack);

        // 13. 页面加载完成后初始化
        window.onload = initStory;
    </script>
